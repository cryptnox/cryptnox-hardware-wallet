name: Build & Deploy Sphinx Docs

on:
  push:
    branches:
      - main
      - 'v[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - 'v[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        run: git fetch --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all versions with sphinx-multiversion
        run: sphinx-multiversion docs/source _site

      - name: Install LaTeX for PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra tex-gyre

      - name: Build a PDF per version (pdflatex)
        # ponytail: version branches carry content only; the LaTeX/logo config lives on
        # main and is applied to each of them with -c. Drop the -c once the branches
        # have their own conf.py latex block.
        run: |
          set -e
          for VER in $(git branch -r --list 'origin/v[0-9]*' | sed 's|.*origin/||' | sort -V); do
            git worktree add "../src-$VER" "origin/$VER"
            RELEASE=$(sed -n "s/^release = '\(.*\)'/\1/p" "../src-$VER/docs/source/conf.py")
            sphinx-build -M latexpdf "../src-$VER/docs/source" "../pdf-$VER" \
              -c docs/source -D release="$RELEASE"
            cp "../pdf-$VER/latex/cryptnox-hardware-wallet.pdf" "_site/$VER/cryptnox-hardware-wallet-$VER.pdf"
          done

      - name: Add root redirect and PDF for the latest version
        run: |
          LATEST=$(git tag -l 'v*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST=$(git branch -r --list 'origin/v[0-9]*' | sed 's|.*origin/||' | sort -V | tail -1 | tr -d '[:space:]')
          fi
          if [ -z "$LATEST" ]; then LATEST="main"; fi
          echo "<meta http-equiv=\"refresh\" content=\"0; url=./${LATEST}/\">" > _site/index.html
          # keep the unversioned PDF URL alive, pointing at the latest version
          cp "_site/$LATEST/cryptnox-hardware-wallet-$LATEST.pdf" _site/cryptnox-hardware-wallet.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
